# Lets xr_media_node get the large UDP receive buffer config/fastdds_udp.xml
# requests (one raw 1920x1080 frame for each of 5 streams). rmem_max is only
# a cap, so other processes keep their default buffer sizes.
# Install: sudo cp 60-xr-media-udp.conf /etc/sysctl.d/ && sudo sysctl --system
net.core.rmem_max = 31104000
